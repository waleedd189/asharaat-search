<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>بحث الاشارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1117;color:#e2e8f0;direction:rtl;min-height:100vh}
.wrap{padding:14px;max-width:640px;margin:0 auto}
h1{font-size:18px;font-weight:600;color:#60a5fa;margin-bottom:14px;letter-spacing:0.3px}
.search-box{position:relative;margin-bottom:10px}
.search-box input{width:100%;padding:14px 46px 14px 14px;font-size:16px;border:1.5px solid #2d3748;border-radius:14px;background:#1a1f2e;color:#e2e8f0;outline:none;direction:rtl;font-family:inherit;transition:border-color 0.2s}
.search-box input:focus{border-color:#3b82f6}
.search-box input::placeholder{color:#4a5568}
.sico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#4a5568;font-size:20px;pointer-events:none}
.tab-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab-row::-webkit-scrollbar{display:none}
.tab{padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid #2d3748;color:#94a3b8;background:#1a1f2e;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all 0.15s}
.tab.on{background:#2563eb;color:#fff;border-color:#2563eb}
.toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.stats{font-size:13px;color:#64748b}
.rtime{font-size:11px;color:#374151;margin-bottom:10px}
.rbtn{font-size:13px;color:#3b82f6;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 6px}

/* CARD */
.card{background:#1a1f2e;border:1px solid #2d3748;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card-name{font-size:16px;font-weight:600;color:#e2e8f0;margin-bottom:10px;line-height:1.4;border-bottom:1px solid #2d3748;padding-bottom:10px}
.card-no{font-size:12px;color:#4a5568;float:left;background:#0f1117;border-radius:6px;padding:2px 8px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.field{padding:8px 0;border-bottom:1px solid #1e2535}
.field:nth-child(odd){border-left:none;padding-left:0}
.field-label{font-size:11px;color:#4a5568;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px}
.field-val{font-size:14px;color:#cbd5e1;font-weight:500}
.field-val.empty{color:#2d3748;font-style:italic;font-size:12px}
.field-val.danger{color:#f87171}
.field-val.warn{color:#fbbf24}
.field-val.ok{color:#34d399}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid #2d3748}
.badge{font-size:12px;padding:4px 12px;border-radius:10px;font-weight:500}
.bb{background:#1e3a5f;color:#60a5fa}
.bg{background:#14532d;color:#4ade80}
.ba{background:#451a03;color:#fb923c}
.br{background:#450a0a;color:#f87171}
.bx{background:#1e2535;color:#64748b}

/* LOADING */
.loading{text-align:center;padding:50px 20px;color:#4a5568;font-size:14px}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid #1e2535;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ERROR */
.err-box{background:#1a0a0a;border:1px solid #7f1d1d;border-radius:14px;padding:16px;margin:10px 0;color:#fca5a5;font-size:14px;line-height:1.8}
.err-box code{font-size:11px;direction:ltr;display:block;margin-top:8px;word-break:break-all;color:#64748b}
.rbtn2{margin-top:14px;padding:11px 26px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
.empty{text-align:center;padding:40px 20px;color:#374151;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>&#128269; بحث الاشارات</h1>
  <div id="loadArea" class="loading">
    <div class="spinner"></div><br>جاري تحميل البيانات...
  </div>
  <div id="mainArea" style="display:none">
    <div class="search-box">
      <span class="sico">&#x2315;</span>
      <input type="search" id="qInput" placeholder="ابحث بالاسم او الرقم القومي او اللوحة..." autocomplete="off" />
    </div>
    <div class="tab-row">
      <div class="tab on" id="t0" onclick="setField('all',0)">الكل</div>
      <div class="tab" id="t1" onclick="setField('name',1)">الاسم</div>
      <div class="tab" id="t2" onclick="setField('id',2)">رقم قومي</div>
      <div class="tab" id="t3" onclick="setField('plate',3)">اللوحة</div>
      <div class="tab" id="t4" onclick="setField('contractor',4)">المقاول</div>
    </div>
    <div class="toprow">
      <div class="stats" id="stEl">اكتب للبحث...</div>
      <button class="rbtn" onclick="loadData()">&#8635; تحديث</button>
    </div>
    <div class="rtime" id="rtEl"></div>
    <div id="resEl"></div>
  </div>
</div>

<script>
var DATA = [];
var FIELD = 'all';
var SHEET_ID = '1jmUEQg3KeRrUe5weJqFaSMFEc9Ahb8SNSqk1n0iDRnc';
var GID = '477351139';

function loadData() {
  document.getElementById('loadArea').style.display = 'block';
  document.getElementById('mainArea').style.display = 'none';
  document.getElementById('loadArea').innerHTML = '<div class="spinner"></div><br>جاري تحميل البيانات...';
  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + GID;
  fetch(url)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(csv){
      DATA = parseCSV(csv);
      document.getElementById('loadArea').style.display = 'none';
      document.getElementById('mainArea').style.display = 'block';
      document.getElementById('rtEl').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG');
      document.getElementById('stEl').textContent = 'تم تحميل ' + DATA.length + ' سجل — اكتب للبحث';
      document.getElementById('qInput').focus();
    })
    .catch(function(){
      var url2 = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + GID;
      document.getElementById('loadArea').innerHTML =
        '<div class="err-box">&#9888; تعذر تحميل البيانات<br>تأكد ان الشيت مضبوط على "Anyone with the link can view"<br><code>'+url2+'</code><br><button class="rbtn2" onclick="loadData()">&#8635; اعادة المحاولة</button></div>';
    });
}

function parseCSV(text) {
  var lines = text.split('\n');
  var result = [];
  var headerFound = false;
  for (var i = 0; i < lines.length; i++) {
    var cells = splitLine(lines[i]);
    if (!cells || cells.length < 3) continue;
    if (!headerFound) {
      var row = cells.join(' ');
      if (row.indexOf('\u0627\u0644\u0627\u0633\u0645') >= 0 || row.indexOf('\u0628\u0637\u0627\u0642\u0629') >= 0) { headerFound = true; }
      continue;
    }
    while (cells.length < 16) cells.push('');
    var name = tr(cells[1]); var id = tr(cells[2]);
    if (!name && !id) continue;
    var num1=tr(cells[5]), train1=tr(cells[4]), num2=tr(cells[8]), train2=tr(cells[7]);
    var p1=tr(cells[14])||(num1&&train1?num1+' '+train1:'');
    var p2=tr(cells[15])||(num2&&train2?num2+' '+train2:'');
    result.push({
      no:tr(cells[0]), name:name, id:id,
      train1:train1, num1:num1, exp1:tr(cells[6]),
      train2:train2, num2:num2, exp2:tr(cells[9]),
      contractor:tr(cells[10]), start:tr(cells[11]),
      end:tr(cells[12]), remaining:tr(cells[13]),
      plate1:p1, plate2:p2
    });
  }
  return result;
}

function tr(s){ return (s||'').trim().replace(/^"|"$/g,''); }

function splitLine(line) {
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){res.push(cur);cur='';}
    else{cur+=c;}
  }
  res.push(cur);
  return res;
}

function expClass(s) {
  if(!s) return '';
  var p=s.replace(/\//g,'-').split('-');
  var d;
  if(p.length===3){
    if(p[0].length===4) d=new Date(+p[0],+p[1]-1,+p[2]);
    else d=new Date(+p[2],+p[1]-1,+p[0]);
  }
  if(!d||isNaN(d.getTime())) return '';
  var diff=(d-Date.now())/864e5;
  return diff<0?'danger':diff<60?'warn':'ok';
}

function setField(f,idx){
  FIELD=f;
  for(var i=0;i<5;i++){var el=document.getElementById('t'+i);if(el)el.classList.toggle('on',i===idx);}
  doSearch();
}

function val(v, ec) {
  if (!v) return '<div class="field-val empty">—</div>';
  var cls = ec ? ' ' + ec : '';
  return '<div class="field-val' + cls + '">' + esc(v) + '</div>';
}

function field(label, v, ec) {
  return '<div class="field"><div class="field-label">' + label + '</div>' + val(v, ec) + '</div>';
}

function doSearch() {
  var q = document.getElementById('qInput').value.trim();
  var stEl = document.getElementById('stEl');
  var resEl = document.getElementById('resEl');
  if (q.length < 2) {
    stEl.textContent = 'تم تحميل ' + DATA.length + ' سجل — اكتب للبحث';
    resEl.innerHTML = '';
    return;
  }
  var hits = [];
  for (var i = 0; i < DATA.length; i++) {
    var x = DATA[i];
    var src = (FIELD==='name')?x.name:(FIELD==='id')?x.id:(FIELD==='plate')?(x.plate1+x.plate2+x.num1+x.num2):(FIELD==='contractor')?x.contractor:(x.name+x.id+x.contractor+x.plate1+x.plate2+x.num1+x.num2);
    if (src.indexOf(q) >= 0) hits.push(i);
  }
  stEl.textContent = 'نتائج: ' + hits.length + ' سجل';
  if (!hits.length) { resEl.innerHTML = '<div class="empty">لا توجد نتائج</div>'; return; }

  var html = '';
  var max = Math.min(hits.length, 50);
  for (var j = 0; j < max; j++) {
    var x = DATA[hits[j]];
    var e1 = expClass(x.exp1);
    var e2 = expClass(x.exp2);

    html += '<div class="card">';
    html += '<div class="card-name"><span class="card-no">#' + esc(x.no) + '</span>' + esc(x.name||'—') + '</div>';
    html += '<div class="field-grid">';
    html += field('الرقم القومي', x.id);
    html += field('المقاول', x.contractor);
    html += field('القاطرة', x.plate1 || x.num1);
    html += field('انتهاء القاطرة', x.exp1, e1);
    html += field('المقطورة', x.plate2 || x.num2);
    html += field('انتهاء المقطورة', x.exp2, e2);
    html += field('اول الاشارة', x.start);
    html += field('نهاية الاشارة', x.end);
    html += field('باقى على الانتهاء', x.remaining);
    html += '</div>';

    var badges = '';
    if (x.plate1) badges += '<span class="badge bb">' + esc(x.plate1) + '</span>';
    if (x.plate2) badges += '<span class="badge bg">' + esc(x.plate2) + '</span>';
    if (e1==='danger') badges += '<span class="badge br">&#9888; القاطرة منتهية</span>';
    else if (e1==='warn') badges += '<span class="badge ba">&#9888; القاطرة قريبة الانتهاء</span>';
    if (e2==='danger') badges += '<span class="badge br">&#9888; المقطورة منتهية</span>';
    else if (e2==='warn') badges += '<span class="badge ba">&#9888; المقطورة قريبة الانتهاء</span>';
    if (badges) html += '<div class="badge-row">' + badges + '</div>';

    html += '</div>';
  }
  if (hits.length > 50) html += '<div class="empty" style="padding:14px">يعرض اول 50 من ' + hits.length + '</div>';
  resEl.innerHTML = html;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('qInput').addEventListener('input', doSearch);
loadData();
</script>
</body>
</html>
