<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الاشارات">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<title>بحث الاشارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,sans-serif;background:#0a0e1a;color:#e2e8f0;direction:rtl;min-height:100vh}
.wrap{padding:14px;max-width:640px;margin:0 auto;padding-bottom:100px}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,#0f1829 0%,#0a0e1a 100%);border:1px solid #1e2d4a;border-radius:20px;padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-40px;left:-40px;width:150px;height:150px;background:radial-gradient(circle,#1d4ed820 0%,transparent 70%);pointer-events:none}
.header-top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.logo-wrap{flex-shrink:0}
.logo-svg{width:52px;height:52px}
.header-text{}
.app-title{font-size:20px;font-weight:900;color:#e2e8f0;line-height:1.1;letter-spacing:-0.3px}
.app-title span{color:#3b82f6}
.app-sub{font-size:12px;color:#475569;margin-top:2px;font-weight:400}
.notif-btn{position:absolute;top:14px;left:14px;background:#1a2535;border:1px solid #2d3f5a;border-radius:10px;padding:7px 11px;color:#94a3b8;font-size:12px;font-family:'Cairo',inherit;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s}
.notif-btn.active{background:#1e3a5f;border-color:#2563eb;color:#60a5fa}
.ndot{width:7px;height:7px;border-radius:50%;background:#334155;flex-shrink:0}
.ndot.on{background:#3b82f6;box-shadow:0 0 5px #3b82f6}

/* ── PERMIT BANNER ── */
.permit-banner{display:flex;align-items:center;gap:12px;background:#0f1829;border:1px solid #1e2d4a;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.permit-icon{flex-shrink:0}
.permit-text{flex:1}
.permit-title{font-size:13px;font-weight:700;color:#93c5fd;margin-bottom:1px}
.permit-desc{font-size:11px;color:#475569}

/* ── ALERT ── */
.alert-banner{background:#160a0a;border:1px solid #7f1d1d;border-radius:14px;padding:12px 14px;margin-bottom:12px;display:none}
.alert-banner.show{display:block}
.alert-title{font-size:13px;font-weight:700;color:#f87171;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.alert-item{font-size:12px;color:#fca5a5;padding:4px 0;border-bottom:1px solid #2a0e0e;line-height:1.5}
.alert-item:last-child{border:none}
.alert-more{font-size:11px;color:#64748b;margin-top:6px}

/* ── INSTALL ── */
.install-bar{background:#0f1829;border:1px solid #1e3a5f;border-radius:14px;padding:11px 14px;margin-bottom:12px;display:none;align-items:center;gap:10px}
.install-bar.show{display:flex}
.install-txt{font-size:13px;color:#93c5fd;flex:1;font-weight:500}
.install-btn{padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Cairo',inherit;flex-shrink:0}

/* ── SEARCH ── */
.search-box{position:relative;margin-bottom:10px}
.search-box input{width:100%;padding:14px 48px 14px 14px;font-size:15px;font-family:'Cairo',inherit;border:1.5px solid #1e2d4a;border-radius:14px;background:#0f1829;color:#e2e8f0;outline:none;direction:rtl;transition:border-color 0.2s;font-weight:500}
.search-box input:focus{border-color:#3b82f6;background:#111827}
.search-box input::placeholder{color:#334155;font-weight:400}
.sico{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#334155;pointer-events:none}

/* ── TABS ── */
.tab-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab-row::-webkit-scrollbar{display:none}
.tab{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;font-family:'Cairo',inherit;cursor:pointer;border:1px solid #1e2d4a;color:#64748b;background:#0f1829;white-space:nowrap;flex-shrink:0;transition:all 0.15s}
.tab.on{background:#2563eb;color:#fff;border-color:#2563eb}

/* ── TOP ROW ── */
.toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.stats{font-size:13px;color:#475569;font-weight:500}
.rtime{font-size:11px;color:#1e2d4a;margin-bottom:10px}
.rbtn{font-size:13px;font-weight:600;color:#3b82f6;background:none;border:none;cursor:pointer;font-family:'Cairo',inherit;padding:4px 6px}

/* ── CARD ── */
.card{background:#0f1829;border:1px solid #1e2d4a;border-radius:18px;padding:14px 16px;margin-bottom:10px;transition:border-color 0.15s}
.card:active{border-color:#2563eb}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #1a2535}
.card-name-wrap{}
.card-name{font-size:16px;font-weight:700;color:#e2e8f0;line-height:1.4}
.card-id-small{font-size:11px;color:#334155;margin-top:2px;direction:ltr;text-align:right;font-family:monospace;letter-spacing:0.5px}
.card-no{font-size:11px;color:#334155;background:#080c14;border-radius:7px;padding:3px 9px;font-weight:600;flex-shrink:0;margin-top:2px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1a2535;border-radius:10px;overflow:hidden;margin-bottom:10px}
.field{padding:9px 10px;background:#0f1829}
.fl{font-size:10px;color:#334155;font-weight:600;letter-spacing:0.5px;margin-bottom:3px;text-transform:uppercase}
.fv{font-size:13px;color:#cbd5e1;font-weight:600}
.fv.empty{color:#1e2d4a;font-weight:400;font-size:12px}
.fv.danger{color:#f87171;font-weight:700}
.fv.warn{color:#fbbf24;font-weight:700}
.fv.ok{color:#34d399;font-weight:600}
.badge-row{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:4px 11px;border-radius:9px;font-weight:700}
.bb{background:#0f2744;color:#60a5fa;border:1px solid #1e3a5f}
.bg{background:#052e16;color:#4ade80;border:1px solid #14532d}
.ba{background:#2c1500;color:#fb923c;border:1px solid #451a03}
.br{background:#200a0a;color:#f87171;border:1px solid #450a0a}

/* ── LOADING ── */
.loading{text-align:center;padding:50px 20px;color:#334155;font-size:14px;font-weight:600}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #1a2535;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:#1e2d4a;font-size:14px;font-weight:600}
.err-box{background:#160a0a;border:1px solid #7f1d1d;border-radius:14px;padding:16px;margin:10px 0;color:#fca5a5;font-size:14px;line-height:1.9;font-weight:500}
.err-box code{font-size:10px;direction:ltr;display:block;margin-top:8px;word-break:break-all;color:#475569}
.rbtn2{margin-top:14px;padding:11px 26px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Cairo',inherit}

/* ── FOOTER LINK ── */
.footer{text-align:center;padding:24px 16px 8px;border-top:1px solid #111827;margin-top:20px}
.footer-label{font-size:11px;color:#1e2d4a;margin-bottom:10px;font-weight:500;letter-spacing:0.5px}
.quran-link{display:inline-flex;align-items:center;gap:10px;background:#0a1a0f;border:1px solid #14532d;border-radius:16px;padding:12px 20px;text-decoration:none;transition:all 0.2s;max-width:300px;width:100%}
.quran-link:hover,.quran-link:active{background:#0d2414;border-color:#16a34a}
.quran-icon{width:38px;height:38px;flex-shrink:0}
.quran-text{text-align:right}
.quran-title{font-size:15px;font-weight:700;color:#4ade80;display:block;line-height:1.3}
.quran-sub{font-size:11px;color:#166534;display:block;margin-top:2px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e3a5f;border:1px solid #2563eb;color:#93c5fd;border-radius:12px;padding:11px 22px;font-size:14px;font-weight:600;z-index:999;transition:transform 0.3s ease;white-space:nowrap;pointer-events:none;font-family:'Cairo',inherit}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
var DATA=[], FIELD='all';
var SHEET_ID='1jmUEQg3KeRrUe5weJqFaSMFEc9Ahb8SNSqk1n0iDRnc';
var GID='477351139';
var deferredPrompt=null, notifEnabled=false;

// PWA Install
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBar').classList.add('show');
});
window.addEventListener('appinstalled',function(){
  document.getElementById('installBar').classList.remove('show');
  showToast('تم تثبيت التطبيق ✓');
});
function doInstall(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(r){
    if(r.outcome==='accepted') showToast('جاري التثبيت...');
    deferredPrompt=null;
    document.getElementById('installBar').classList.remove('show');
  });
}

// Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}

// Notifications
function toggleNotif(){
  if(!('Notification' in window)){showToast('المتصفح لا يدعم التنبيهات');return;}
  if(Notification.permission==='granted'&&notifEnabled){
    notifEnabled=false; localStorage.setItem('notif','0');
    updateNotifBtn(); showToast('تم إيقاف التنبيهات'); return;
  }
  Notification.requestPermission().then(function(p){
    if(p==='granted'){
      notifEnabled=true; localStorage.setItem('notif','1');
      updateNotifBtn(); showToast('تم تفعيل التنبيهات ✓');
      checkAndNotify();
    } else { showToast('يرجى السماح بالتنبيهات من إعدادات المتصفح'); }
  });
}
function updateNotifBtn(){
  var dot=document.getElementById('notifDot');
  var txt=document.getElementById('notifTxt');
  var btn=document.getElementById('notifBtn');
  var on=notifEnabled&&Notification.permission==='granted';
  dot.classList.toggle('on',on);
  txt.textContent=on?'تنبيهات فعّالة':'تنبيهات';
  btn.classList.toggle('active',on);
}
function checkAndNotify(){
  if(!DATA.length)return;
  var expired=[],warn=[];
  for(var i=0;i<DATA.length;i++){
    var x=DATA[i];
    var e1=expClass(x.exp1),e2=expClass(x.exp2);
    if(e1==='danger'||e2==='danger') expired.push(x.name);
    else if(e1==='warn'||e2==='warn') warn.push(x.name);
  }
  showAlertBanner(expired,warn);
  if(notifEnabled&&Notification.permission==='granted'){
    if(expired.length>0){
      new Notification('⚠️ تراخيص منتهية',{
        body:expired.slice(0,3).join('، ')+(expired.length>3?' و'+(expired.length-3)+' آخرين':''),
        icon:'/icon-192.png',dir:'rtl',lang:'ar',tag:'expired'
      });
    } else if(warn.length>0){
      new Notification('🕐 تراخيص قريبة الانتهاء',{
        body:warn.slice(0,3).join('، ')+(warn.length>3?' و'+(warn.length-3)+' آخرين':''),
        icon:'/icon-192.png',dir:'rtl',lang:'ar',tag:'warn'
      });
    }
  }
}
function showAlertBanner(expired,warn){
  var banner=document.getElementById('alertBanner');
  var list=document.getElementById('alertList');
  var all=[];
  for(var i=0;i<Math.min(expired.length,5);i++)
    all.push('<div class="alert-item">🔴 '+esc(expired[i])+' — منتهى</div>');
  for(var j=0;j<Math.min(warn.length,5);j++)
    all.push('<div class="alert-item">🟡 '+esc(warn[j])+' — قريب الانتهاء</div>');
  if(all.length>0){
    list.innerHTML=all.join('');
    var extra=expired.length+warn.length-10;
    if(extra>0) list.innerHTML+='<div class="alert-more">و '+extra+' سجلات أخرى...</div>';
    banner.classList.add('show');
  } else { banner.classList.remove('show'); }
}

// Data
function loadData(){
  document.getElementById('loadArea').style.display='block';
  document.getElementById('mainArea').style.display='none';
  document.getElementById('loadArea').innerHTML='<div class="spinner"></div><br>جاري تحميل البيانات...';
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID;
  fetch(url)
    .then(function(r){if(!r.ok)throw new Error();return r.text();})
    .then(function(csv){
      DATA=parseCSV(csv);
      document.getElementById('loadArea').style.display='none';
      document.getElementById('mainArea').style.display='block';
      document.getElementById('rtEl').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');
      document.getElementById('stEl').textContent='تم تحميل '+DATA.length+' سجل — اكتب للبحث';
      document.getElementById('qInput').focus();
      checkAndNotify();
    })
    .catch(function(){
      var url2='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID;
      document.getElementById('loadArea').innerHTML=
        '<div class="err-box">&#9888; تعذر تحميل البيانات<br>تأكد ان الشيت مضبوط على "Anyone with the link can view"<br><code>'+url2+'</code><br><button class="rbtn2" onclick="loadData()">&#8635; اعادة المحاولة</button></div>';
    });
}

function parseCSV(text){
  var lines=text.split('\n'),result=[],headerFound=false;
  for(var i=0;i<lines.length;i++){
    var cells=splitLine(lines[i]);
    if(!cells||cells.length<3)continue;
    if(!headerFound){
      var r=cells.join(' ');
      if(r.indexOf('\u0627\u0644\u0627\u0633\u0645')>=0||r.indexOf('\u0628\u0637\u0627\u0642\u0629')>=0){headerFound=true;}
      continue;
    }
    while(cells.length<16)cells.push('');
    var name=tr(cells[1]),id=tr(cells[2]);
    if(!name&&!id)continue;
    var n1=tr(cells[5]),t1=tr(cells[4]),n2=tr(cells[8]),t2=tr(cells[7]);
    result.push({
      no:tr(cells[0]),name:name,id:id,
      train1:t1,num1:n1,exp1:tr(cells[6]),
      train2:t2,num2:n2,exp2:tr(cells[9]),
      contractor:tr(cells[10]),start:tr(cells[11]),
      end:tr(cells[12]),remaining:tr(cells[13]),
      plate1:tr(cells[14])||(n1&&t1?n1+' '+t1:''),
      plate2:tr(cells[15])||(n2&&t2?n2+' '+t2:'')
    });
  }
  return result;
}
function tr(s){return(s||'').trim().replace(/^"|"$/g,'');}
function splitLine(line){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){res.push(cur);cur='';}
    else{cur+=c;}
  }
  res.push(cur);return res;
}
function expClass(s){
  if(!s)return'';
  var p=s.replace(/\//g,'-').split('-');var d;
  if(p.length===3){if(p[0].length===4)d=new Date(+p[0],+p[1]-1,+p[2]);else d=new Date(+p[2],+p[1]-1,+p[0]);}
  if(!d||isNaN(d.getTime()))return'';
  var diff=(d-Date.now())/864e5;
  return diff<0?'danger':diff<60?'warn':'ok';
}

// Search
function setField(f,idx){
  FIELD=f;
  for(var i=0;i<5;i++){var el=document.getElementById('t'+i);if(el)el.classList.toggle('on',i===idx);}
  doSearch();
}
function doSearch(){
  var q=document.getElementById('qInput').value.trim();
  var stEl=document.getElementById('stEl'),resEl=document.getElementById('resEl');
  if(q.length<2){stEl.textContent='تم تحميل '+DATA.length+' سجل — اكتب للبحث';resEl.innerHTML='';return;}
  var hits=[];
  for(var i=0;i<DATA.length;i++){
    var x=DATA[i];
    var src=(FIELD==='name')?x.name:(FIELD==='id')?x.id:(FIELD==='plate')?(x.plate1+x.plate2+x.num1+x.num2):(FIELD==='contractor')?x.contractor:(x.name+x.id+x.contractor+x.plate1+x.plate2+x.num1+x.num2);
    if(src.indexOf(q)>=0)hits.push(i);
  }
  stEl.textContent='نتائج: '+hits.length+' سجل';
  if(!hits.length){resEl.innerHTML='<div class="empty">لا توجد نتائج</div>';return;}
  var html='',max=Math.min(hits.length,50);
  for(var j=0;j<max;j++){
    var x=DATA[hits[j]];
    var e1=expClass(x.exp1),e2=expClass(x.exp2);
    html+='<div class="card">';
    html+='<div class="card-header"><div class="card-name-wrap"><div class="card-name">'+esc(x.name||'—')+'</div>';
    if(x.id)html+='<div class="card-id-small">'+esc(x.id)+'</div>';
    html+='</div><div class="card-no"># '+esc(x.no)+'</div></div>';
    html+='<div class="field-grid">';
    html+=fld('المقاول',x.contractor,'');
    html+=fld('القاطرة',x.plate1||x.num1,'');
    html+=fld('انتهاء القاطرة',x.exp1,e1);
    html+=fld('المقطورة',x.plate2||x.num2,'');
    html+=fld('انتهاء المقطورة',x.exp2,e2);
    html+=fld('أول الإشارة',x.start,'');
    html+=fld('نهاية الإشارة',x.end,'');
    html+=fld('باقى على الانتهاء',x.remaining,'');
    html+='</div>';
    var b='';
    if(x.plate1)b+='<span class="badge bb">'+esc(x.plate1)+'</span>';
    if(x.plate2)b+='<span class="badge bg">'+esc(x.plate2)+'</span>';
    if(e1==='danger')b+='<span class="badge br">⚠ القاطرة منتهية</span>';
    else if(e1==='warn')b+='<span class="badge ba">⏰ قريبة الانتهاء</span>';
    if(e2==='danger')b+='<span class="badge br">⚠ المقطورة منتهية</span>';
    else if(e2==='warn')b+='<span class="badge ba">⏰ قريبة الانتهاء</span>';
    if(b)html+='<div class="badge-row">'+b+'</div>';
    html+='</div>';
  }
  if(hits.length>50)html+='<div class="empty" style="padding:14px">يعرض أول 50 من '+hits.length+'</div>';
  resEl.innerHTML=html;
}
function fld(label,v,ec){
  var valHtml=v?'<div class="fv '+(ec||'')+'">'+esc(v)+'</div>':'<div class="fv empty">—</div>';
  return'<div class="field"><div class="fl">'+label+'</div>'+valHtml+'</div>';
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Toast
var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},3000);
}

// Init
notifEnabled=localStorage.getItem('notif')==='1';
if(notifEnabled&&Notification.permission!=='granted'){notifEnabled=false;}
updateNotifBtn();
document.getElementById('qInput').addEventListener('input',doSearch);
setInterval(loadData,30*60*1000);
loadData();
</script>
